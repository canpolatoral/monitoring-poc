# Loki single binary with filesystem storage: enough for Envoy access logs in a POC.
# OpenShift: Loki Operator + LokiStack (object storage), see docs/openshift-mapping.md.
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: loki_index_, period: 24h }
  limits_config:
    allow_structured_metadata: true     # OTLP log attributes (response_flags, ...) land here
    volume_enabled: true
    retention_period: 48h
  pattern_ingester:
    enabled: false
  # Retention is only enforced by the compactor; without this, retention_period is ignored
  # and logs pile up until the volume is full.
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    delete_request_store: filesystem
singleBinary:
  replicas: 1
  persistence: { size: 5Gi }
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 1Gi }
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
gateway: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
minio: { enabled: false }
