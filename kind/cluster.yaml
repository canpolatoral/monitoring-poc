# kind cluster for the observability POC: 1 control plane + 2 workers.
# Host ports are bound to 127.0.0.1 only. NodePorts are reachable on every node,
# so mapping them from the control-plane container is enough.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bank-poc
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 18080, listenAddress: 127.0.0.1 } # Istio ingress gateway (bank API)
      - { containerPort: 30001, hostPort: 20001, listenAddress: 127.0.0.1 } # Kiali
      - { containerPort: 30000, hostPort: 13000, listenAddress: 127.0.0.1 } # Grafana
      - { containerPort: 30090, hostPort: 19090, listenAddress: 127.0.0.1 } # Prometheus
      - { containerPort: 30093, hostPort: 19093, listenAddress: 127.0.0.1 } # Alertmanager
      - { containerPort: 30200, hostPort: 13200, listenAddress: 127.0.0.1 } # Tempo HTTP API
      - { containerPort: 30088, hostPort: 18088, listenAddress: 127.0.0.1 } # Red-dot dashboard
  - role: worker
  - role: worker
