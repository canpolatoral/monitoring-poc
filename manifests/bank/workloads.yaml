# ---------------------------------------------------------------- auth-svc (Login and OTP)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-svc
---
apiVersion: v1
kind: Service
metadata:
  name: auth-svc
  labels: { app: auth-svc }
  annotations:                                  # shown by the red-dot dashboard
    observability.bank/description: "Login and OTP"
    observability.bank/owner: "identity team"
spec:
  selector: { app: auth-svc }
  ports:
    - name: http
      port: 8080
      targetPort: http
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-svc
  labels: { app: auth-svc, version: v1 }
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-svc }
  template:
    metadata:
      labels: { app: auth-svc, version: v1 }
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"   # OTel auto-instrumentation
        instrumentation.opentelemetry.io/container-names: app
        traffic.sidecar.istio.io/excludeOutboundPorts: "4318"    # keep span export out of the service graph
    spec:
      serviceAccountName: auth-svc
      containers:
        - name: app
          image: bank-svc:poc
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: SERVICE_NAME, value: auth-svc }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
# ---------------------------------------------------------------- accounts-svc (Balances)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: accounts-svc
---
apiVersion: v1
kind: Service
metadata:
  name: accounts-svc
  labels: { app: accounts-svc }
  annotations:                                  # shown by the red-dot dashboard
    observability.bank/description: "Balances"
    observability.bank/owner: "accounts team"
spec:
  selector: { app: accounts-svc }
  ports:
    - name: http
      port: 8080
      targetPort: http
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-svc
  labels: { app: accounts-svc, version: v1 }
spec:
  replicas: 1
  selector:
    matchLabels: { app: accounts-svc }
  template:
    metadata:
      labels: { app: accounts-svc, version: v1 }
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"   # OTel auto-instrumentation
        instrumentation.opentelemetry.io/container-names: app
        traffic.sidecar.istio.io/excludeOutboundPorts: "4318"    # keep span export out of the service graph
    spec:
      serviceAccountName: accounts-svc
      containers:
        - name: app
          image: bank-svc:poc
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: SERVICE_NAME, value: accounts-svc }
            - name: DB_DSN                # created by scripts/externals.sh (random password)
              valueFrom: { secretKeyRef: { name: bank-db-credentials, key: dsn, optional: true } }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
